    <!-- 🔍 SCRIPT DE BUSCA E NAVEGAÇÃO -->
    <script>
        function buscarMusica() {
            const termo = document.getElementById('campo-busca').value.toLowerCase().trim();
            if (!termo) return;

            const cards = document.querySelectorAll('.card-video');
            let encontrado = false;

            // Remove destaques anteriores
            cards.forEach(card => card.classList.remove('destaque-busca'));

            for (let card of cards) {
                const nomeMusica = (card.getAttribute('data-nome') || '').toLowerCase();
                const iframeTitle = (card.querySelector('iframe')?.title || '').toLowerCase();

                if (nomeMusica.includes(termo) || iframeTitle.includes(termo)) {
                    // Rola até a música
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    // Adiciona o brilho
                    card.classList.add('destaque-busca');
                    encontrado = true;
                    break;
                }
            }

            if (!encontrado) {
                alert('Música não encontrada! Tente buscar por outro termo.');
            }
        }

        function verificarEnter(event) {
            if (event.key === 'Enter') {
                buscarMusica();
            }
        }
    </script>
