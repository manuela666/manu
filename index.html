<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Player de Música</title>
  <style>
    /* =========================================
       1. ESTILOS GERAIS E VARIÁVEIS
       ========================================= */
    :root {
      --bg-dark: #121214;
      --card-bg: #1e1e24;
      --card-hover: #2a2a32;
      --primary: #9d4edd;
      --primary-bright: #c77dff;
      --text-main: #ffffff;
      --text-sub: #a0a0b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem 8rem 1rem; /* Espaço na parte inferior para o player fixo */
    }

    h1 {
      margin-bottom: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--primary-bright);
    }

    /* =========================================
       2. GRADE DE MÚSICAS (CARDS LADO A LADO)
       ========================================= */
    .playlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }

    .musica-card {
      background-color: var(--card-bg);
      padding: 1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 2px solid transparent;
    }

    .musica-card:hover {
      background-color: var(--card-hover);
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    /* Estilo para a música que está tocando no momento */
    .musica-card.tocando {
      border-color: var(--primary-bright);
      background-color: var(--card-hover);
      box-shadow: 0 0 15px rgba(199, 125, 255, 0.3);
    }

    .capa-container {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 0.8rem;
      position: relative;
    }

    .capa-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .titulo-musica {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: var(--text-main);
    }

    .nome-artista {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* =========================================
       3. PLAYER DE ÁUDIO FIXO NA PARTE INFERIOR
       ========================================= */
    .player-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #18181b;
      border-top: 1px solid #2d2d35;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.5);
    }

    .info-musica-atual {
      font-size: 0.9rem;
      color: var(--primary-bright);
      font-weight: 500;
    }

    audio {
      width: 100%;
      max-width: 600px;
      height: 40px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <h1>Minha Playlist</h1>

  <!-- Grade de Músicas -->
  <div class="playlist-grid">

    <!-- MÚSICA 1 -->
    <!-- Coloque o caminho do seu arquivo MP3 no 'data-src' -->
    <div class="musica-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
      <div class="capa-container">
        <img src="https://picsum.photos/200?random=1" alt="Capa da Música 1">
      </div>
      <div class="titulo-musica">Música Número 1</div>
      <div class="nome-artista">Artista Exemplo A</div>
    </div>

    <!-- MÚSICA 2 -->
    <div class="musica-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
      <div class="capa-container">
        <img src="https://picsum.photos/200?random=2" alt="Capa da Música 2">
      </div>
      <div class="titulo-musica">Música Número 2</div>
      <div class="nome-artista">Artista Exemplo B</div>
    </div>

    <!-- MÚSICA 3 -->
    <div class="musica-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">
      <div class="capa-container">
        <img src="https://picsum.photos/200?random=3" alt="Capa da Música 3">
      </div>
      <div class="titulo-musica">Música Número 3</div>
      <div class="nome-artista">Artista Exemplo C</div>
    </div>

    <!-- MÚSICA 4 -->
    <div class="musica-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3">
      <div class="capa-container">
        <img src="https://picsum.photos/200?random=4" alt="Capa da Música 4">
      </div>
      <div class="titulo-musica">Música Número 4</div>
      <div class="nome-artista">Artista Exemplo D</div>
    </div>

  </div>

  <!-- Player de Áudio na parte inferior -->
  <div class="player-container">
    <div class="info-musica-atual" id="infoMusica">Clique em uma música para tocar</div>
    <audio id="meuPlayer" controls></audio>
  </div>

  <!-- =========================================
       4. JAVASCRIPT (LÓGICA AUTOMÁTICA DE TROCA)
       ========================================= -->
  <script>
    const player = document.getElementById('meuPlayer');
    const cards = document.querySelectorAll('.musica-card');
    const infoMusica = document.getElementById('infoMusica');
    
    let indiceAtual = 0;

    // Função para tocar uma música específica pelo seu número (índice)
    function tocarMusica(index) {
      if (index >= cards.length) {
        // Se chegou ao final da playlist, recomeça da primeira
        index = 0;
      }

      indiceAtual = index;
      const cardAtual = cards[indiceAtual];
      const audioUrl = cardAtual.getAttribute('data-src');
      const titulo = cardAtual.querySelector('.titulo-musica').textContent;
      const artista = cardAtual.querySelector('.nome-artista').textContent;

      // 1. Atualiza a fonte do player e toca
      player.src = audioUrl;
      player.play();

      // 2. Atualiza o texto na tela
      infoMusica.textContent = `Tocando agora: ${titulo} - ${artista}`;

      // 3. Remove o destaque visual de todos os cards
      cards.forEach(c => c.classList.remove('tocando'));

      // 4. Adiciona destaque visual no card que está tocando
      cardAtual.classList.add('tocando');
    }

    // Clique em qualquer card de música para tocar
    cards.forEach((card, index) => {
      card.addEventListener('click', () => {
        tocarMusica(index);
      });
    });

    // MÁGICA AQUI: Quando a música terminar (evento 'ended'), toca a próxima do lado!
    player.addEventListener('ended', () => {
      tocarMusica(indiceAtual + 1);
    });
  </script>

</body>
</html>
