<script>
    document.querySelectorAll('.video-container').forEach(container => {
        container.addEventListener('click', (e) => {
            const rect = container.getBoundingClientRect();
            // Pega a posição exata do clique dentro do vídeo
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            soltarEstrelas(container, x, y);
        });
    });

    function soltarEstrelas(container, posX, posY) {
        for (let i = 0; i < 15; i++) {
            const estrela = document.createElement('div');
            estrela.className = 'estrela-clique';
            
            estrela.style.left = `${posX}px`;
            estrela.style.top = `${posY}px`;

            const angulo = Math.random() * Math.PI * 2;
            const distancia = 50 + Math.random() * 80; 
            const tx = Math.cos(angulo) * distancia;
            const ty = Math.sin(angulo) * distancia;

            estrela.style.setProperty('--tx', `${tx}px`);
            estrela.style.setProperty('--ty', `${ty}px`);

            const tamanho = 6 + Math.random() * 8;
            estrela.style.width = `${tamanho}px`;
            estrela.style.height = `${tamanho}px`;

            container.appendChild(estrela);

            setTimeout(() => {
                estrela.remove();
            }, 800);
        }
    }
</script>
