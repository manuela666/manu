<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lily Music</title>
    
    <style>
        /* ESTILOS GERAIS (CSS) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }

        /* CABEÇALHO E NAVEGAÇÃO */
        .cabecalho {
            background-color: #1e1e1e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff0055;
            text-decoration: none;
        }

        .menu-navegacao a {
            color: #ccc;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        .menu-navegacao a:hover {
            color: #ff0055;
        }

        /* BARRA DE PESQUISA */
        .container-busca {
            display: flex;
            align-items: center;
            background-color: #2b2b2b;
            padding: 5px 10px;
            border-radius: 20px;
        }

        .container-busca input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px;
            outline: none;
            width: 180px;
        }

        .container-busca button {
            background-color: #ff0055;
            border: none;
            color: #fff;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .container-busca button:hover {
            background-color: #d60047;
        }

        /* SEÇÕES DE MÚSICA */
        main {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .secao-genero {
            margin-bottom: 40px;
        }

        .titulo-secao {
            font-size: 22px;
            margin-bottom: 20px;
            border-left: 4px solid #ff0055;
            padding-left: 10px;
            transition: background 0.5s;
        }

        /* GRID DE VÍDEOS */
        .grid-videos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* CARD DE VÍDEO */
        .card-video {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, outline 0.3s ease;
        }

        .card-video:hover {
            transform: translateY(-5px);
        }

        /* EFEITO DE DESTAQUE NA PESQUISA */
        .card-destacado {
            transform: scale(1.05);
            outline: 3px solid #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
        }

        .wrapper-video {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Proporção 16:9 */
            background-color: #000;
        }

        .yt-player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .overlay-play {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .overlay-play img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .botao-play-custom {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background-color: rgba(255, 0, 85, 0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .botao-play-custom::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 55%;
            transform: translate(-50%, -50%);
            border-style: solid;
            border-width: 8px 0 8px 14px;
            border-color: transparent transparent transparent #ffffff;
        }

        .titulo-video {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        /* SEÇÃO SOBRE E RODAPÉ */
        .secao-sobre {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin-top: 50px;
        }

        .rodape {
            text-align: center;
            padding: 20px;
            background-color: #1e1e1e;
            margin-top: 40px;
            border-top: 1px solid #333;
            color: #888;
        }

        /* ANIMAÇÃO PARA DESTAQUE DO TÍTULO DO MENU */
        .destaque-temporario {
            background-color: rgba(255, 0, 85, 0.3);
            padding-left: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <a href="#" class="logo">Lily Music</a>
        
        <nav class="menu-navegacao">
            <a href="#rap" onclick="destacarTitulo('titulo-rap')">Rap</a>
            <a href="#sertanejo" onclick="destacarTitulo('titulo-sertanejo')">Sertanejo</a>
            <a href="#funk" onclick="destacarTitulo('titulo-funk')">Funk</a>
            <a href="#sobre">Sobre</a>
        </nav>

        <div class="container-busca">
            <input type="text" id="campo-busca" placeholder="Pesquisar música..." onkeypress="verificarEnter(event)">
            <button onclick="buscarMusica()">Buscar</button>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <!-- SEÇÃO RAP -->
        <section id="rap" class="secao-genero">
            <h2 id="titulo-rap" class="titulo-secao">Rap</h2>
            <div class="grid-videos">
                
                <div class="card-video" data-nome="rap 1">
                    <div class="wrapper-video">
                        <div id="player-rap1" class="yt-player-container"></div>
                        <div class="overlay-play" onclick="iniciarVideo(this, 'rap1')">
                            <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="Rap 1">
                            <button class="botao-play-custom"></button>
                        </div>
                    </div>
                    <p class="titulo-video">Música de Rap 1</p>
                </div>

            </div>
        </section>

        <!-- SEÇÃO SERTANEJO -->
        <section id="sertanejo" class="secao-genero">
            <h2 id="titulo-sertanejo" class="titulo-secao">Sertanejo</h2>
            <div class="grid-videos">
                
                <div class="card-video" data-nome="sertanejo 1">
                    <div class="wrapper-video">
                        <div id="player-sert1" class="yt-player-container"></div>
                        <div class="overlay-play" onclick="iniciarVideo(this, 'sert1')">
                            <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="Sertanejo 1">
                            <button class="botao-play-custom"></button>
                        </div>
                    </div>
                    <p class="titulo-video">Música de Sertanejo 1</p>
                </div>

            </div>
        </section>

        <!-- SEÇÃO FUNK -->
        <section id="funk" class="secao-genero">
            <h2 id="titulo-funk" class="titulo-secao">Funk</h2>
            <div class="grid-videos">

                <div class="card-video" data-nome="trilogia 150">
                    <div class="wrapper-video">
                        <div id="player-UTYNURBuv7o" class="yt-player-container"></div>
                        <div class="overlay-play" onclick="iniciarVideo(this, 'UTYNURBuv7o')">
                            <img src="https://img.youtube.com/vi/UTYNURBuv7o/hqdefault.jpg" alt="Trilogia 150">
                            <button class="botao-play-custom"></button>
                        </div>
                    </div>
                    <p class="titulo-video">Trilogia 150 BPM</p>
                </div>

            </div>
        </section>

        <!-- SOBRE -->
        <section id="sobre" class="secao-sobre">
            <h2>Sobre o Lily Music</h2>
            <p>O Lily Music é um espaço dedicado à seleção e reprodução das melhores faixas de Rap, Sertanejo e Funk.</p>
        </section>

    </main>

    <footer class="rodape">
        <p>&copy; 2026 Lily Music. Todos os direitos reservados.</p>
    </footer>

    <!-- INTERAÇÕES E PESQUISA -->
    <script>
        // Carrega a API de vídeos do YouTube
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var players = {};

        function iniciarVideo(overlayElement, videoId) {
            overlayElement.style.display = 'none';

            players[videoId] = new YT.Player('player-' + videoId, {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'rel': 0
                }
            });
        }

        // BUSCA QUE MANTÉM TODAS AS MÚSICAS E ROLA ATÉ A PESQUISADA
        function buscarMusica() {
            var termo = document.getElementById('campo-busca').value.toLowerCase().trim();
            
            if (termo === '') return;

            var cards = document.querySelectorAll('.card-video');
            var encontrado = false;

            cards.forEach(function(card) {
                var nome = card.getAttribute('data-nome') || '';
                var titulo = card.querySelector('.titulo-video').textContent.toLowerCase();

                // Procura a primeira música que corresponde ao termo digitado
                if (!encontrado && (nome.includes(termo) || titulo.includes(termo))) {
                    encontrado = true;

                    // Rola a tela suavemente até a música encontrada
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // Destaca o card temporariamente com borda e brilho
                    card.classList.add('card-destacado');
                    setTimeout(function() {
                        card.classList.remove('card-destacado');
                    }, 2500);
                }
            });

            if (!encontrado) {
                alert('Música não encontrada!');
            }
        }

        function verificarEnter(event) {
            if (event.key === 'Enter') {
                buscarMusica();
            }
        }

        function destacarTitulo(idTitulo) {
            var titulo = document.getElementById(idTitulo);
            if (titulo) {
                titulo.classList.add('destaque-temporario');
                setTimeout(function() {
                    titulo.classList.remove('destaque-temporario');
                }, 2000);
            }
        }
    </script>
</body>
</html>
