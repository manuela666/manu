<!-- Scripts para detectar o PLAY do vídeo -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let players = [];

    function onYouTubeIframeAPIReady() {
        const iframes = document.querySelectorAll('iframe');
        iframes.forEach((iframe, index) => {
            iframe.id = 'player-' + index;
            players.push(new YT.Player(iframe.id, {
                events: {
                    'onStateChange': (event) => onPlayerStateChange(event, iframe)
                }
            }));
        });
    }

    function onPlayerStateChange(event, iframe) {
        // YT.PlayerState.PLAYING é igual a 1
        if (event.data === YT.PlayerState.PLAYING) {
            const container = iframe.closest('.video-container');
            criarExplosaoEstrelas(container);
        }
    }

    function criarExplosaoEstrelas(container) {
        for (let i = 0; i < 25; i++) {
            const estrela = document.createElement('div');
            estrela.className = 'estrela-explosao';
            
            // Posição centralizada atrás do vídeo
            estrela.style.left = '50%';
            estrela.style.top = '50%';
            
            // Ângulos e distâncias aleatórias para explodir em todas as direções
            const angulo = Math.random() * Math.PI * 2;
            const distancia = 120 + Math.random() * 180; 
            const tx = Math.cos(angulo) * distancia;
            const ty = Math.sin(angulo) * distancia;

            estrela.style.setProperty('--tx', `${tx}px`);
            estrela.style.setProperty('--ty', `${ty}px`);
            
            // Tamanho aleatório
            const tamanho = 8 + Math.random() * 14;
            estrela.style.width = `${tamanho}px`;
            estrela.style.height = `${tamanho}px`;

            container.appendChild(estrela);

            // Apaga as estrelas após a animação terminar
            setTimeout(() => {
                estrela.remove();
            }, 1200);
        }
    }
</script>
