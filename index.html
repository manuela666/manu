    <!-- 🔍 SCRIPT DE BUSCA APERFEIÇOADO -->
    <script>
        // Função auxiliar para remover acentos (ex: "Intenção" vira "intencao")
        function normalizarTexto(texto) {
            return texto
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim();
        }

        function buscarMusica() {
            const termoBruto = document.getElementById('campo-busca').value;
            const termo = normalizarTexto(termoBruto);

            if (!termo) return;

            const cards = document.querySelectorAll('.card-video');
            let encontrado = false;

            // Limpa destaques de buscas anteriores
            cards.forEach(card => card.classList.remove('destaque-busca'));

            for (let card of cards) {
                const dataNome = normalizarTexto(card.getAttribute('data-nome') || '');
                const iframeTitle = normalizarTexto(card.querySelector('iframe')?.title || '');

                // Verifica se o termo digitado está presente no data-nome ou no título do vídeo
                if (dataNome.includes(termo) || iframeTitle.includes(termo)) {
                    // Centraliza a rolagem na tela para o vídeo exato
                    card.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                    
                    // Aplica a animação com brilho no card encontrado
                    card.classList.add('destaque-busca');
                    encontrado = true;
                    break; // Para no primeiro vídeo encontrado correspondente
                }
            }

            if (!encontrado) {
                alert('Música não encontrada! Tente digitar outra palavra ou o nome do cantor.');
            }
        }

        function verificarEnter(event) {
            if (event.key === 'Enter') {
                buscarMusica();
            }
        }
    </script>
