<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lily - Músicas</title>
</head>

<body>

    <!-- 🌟 CANVAS DAS ESTRELAS PRATEADAS -->
    <canvas id="canvas-estrelas"></canvas>

    <!-- 📌 MENU SUPERIOR -->
    <header class="menu-superior">
        <div class="logo">Lily</div>
        <nav class="nav-central">
            <ul>
                <li><a href="#inicio">Início</a></li>
                <li><a href="#pop">Pop</a></li>
                <li><a href="#internacionais">Internacionais</a></li>
                <li><a href="#nacionais">Nacionais</a></li>
                <li><a href="#favoritas">Favoritas</a></li>
            </ul>
        </nav>
        <div class="caixa-pesquisa">
            <input type="text" id="campo-busca" placeholder="Buscar música...">
            <button onclick="buscarMusica()">🔍</button>
        </div>
    </header>

    <!-- 🌌 PARTICULAS E NOTAS MUSICAIS DE FUNDO -->
    <div class="particulas">
        <div class="nota-musical">🎵</div>
        <div class="nota-musical">🎶</div>
        <div class="nota-musical">✨</div>
        <div class="nota-musical">🎵</div>
        <div class="nota-musical">🎶</div>
    </div>

    <!-- 🌸 BANNER PRINCIPAL DESTAQUE -->
    <main class="conteudo-principal" id="inicio">
        <section class="banner-destaque">
            <div class="fundo-decorativo-banner">
                <span class="icone-fundo esquerda-top">🎵</span>
                <span class="icone-fundo esquerda-bottom">🎶</span>
                <span class="icone-fundo direita-top">✨</span>
                <span class="icone-fundo direita-bottom">🎧</span>
            </div>

            <div class="brilhos-titulo">
                <span class="elemento-float pos-1">✦</span>
                <span class="elemento-float pos-2">✧</span>
                <span class="elemento-float pos-3">✦</span>
                <span class="elemento-float pos-4">✧</span>
                <span class="elemento-float pos-5">✦</span>
            </div>

            <h1 class="titulo-assinatura">Lily</h1>

            <div class="divisor-banner">
                <span class="linha-lado"></span>
                <span class="estrela-central">★</span>
                <span class="linha-lado"></span>
            </div>
        </section>

        <!-- 🎵 SEÇÃO POP -->
        <section class="secao-musica" id="pop">
            <h2>Pop</h2>
            <div class="videos">
                <div class="card-video">
                    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Vídeo Pop 1" allowfullscreen></iframe>
                </div>
                <div class="card-video">
                    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Vídeo Pop 2" allowfullscreen></iframe>
                </div>
                <div class="card-video">
                    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Vídeo Pop 3" allowfullscreen></iframe>
                </div>
            </div>
        </section>

        <!-- 🎵 SEÇÃO INTERNACIONAIS -->
        <section class="secao-musica" id="internacionais">
            <h2>Internacionais</h2>
            <div class="videos">
                <div class="card-video">
                    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Vídeo Internacional 1" allowfullscreen></iframe>
                </div>
                <div class="card-video">
                    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Vídeo Internacional 2" allowfullscreen></iframe>
                </div>
            </div>
        </section>

        <!-- 🎵 SEÇÃO NACIONAIS -->
        <section class="secao-musica" id="nacionais">
            <h2>Nacionais</h2>
            <div class="videos">
                <div class="card-video">
                    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Vídeo Nacional 1" allowfullscreen></iframe>
                </div>
                <div class="card-video">
                    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Vídeo Nacional 2" allowfullscreen></iframe>

        <!-- 🎵 SEÇÃO FAVORITAS -->
        <section class="secao-musica" id="favoritas">
            <h2>Favoritas</h2>
            <div class="videos">
                <div class="card-video">
                    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Vídeo Favorita 1" allowfullscreen></iframe>

    </main>

    <!-- 🌸 RODAPÉ ELEGANTE -->
    <footer>
        <div class="conteudo-rodape">
            <h3>Lily</h3>
            <p>Sua coleção de músicas favoritas em um só lugar.</p>
            <div class="linha-decorativa"></div>
            <p class="direitos">© Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- 🌟 SCRIPT DAS 50 ESTRELAS PRATEADAS PISCANTES -->
    <script>
        const canvas = document.getElementById('canvas-estrelas');
        const ctx = canvas.getContext('2d');

        function redimensionarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionarCanvas);
        redimensionarCanvas();

        const totalEstrelas = 50;
        const estrelas = [];

        // Criando as 50 estrelas com atributos aleatórios
        for (let i = 0; i < totalEstrelas; i++) {
            estrelas.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                tamanho: Math.random() * 2.5 + 1,
                brilho: Math.random(),
                velocidadeBrilho: Math.random() * 0.02 + 0.005,
                velocidadeX: (Math.random() - 0.5) * 0.3,
                velocidadeY: (Math.random() - 0.5) * 0.3
            });
        }

        // Desenha a estrela prateada radiante (com efeito de cruz de 4 pontas)
        function desenharEstrelaPrata(x, y, tamanho, opacidade) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = opacidade;

            // Centro brilhante prateado
            const gradiente = ctx.createRadialGradient(0, 0, 0, 0, 0, tamanho * 2);
            gradiente.addColorStop(0, '#FFFFFF');
            gradiente.addColorStop(0.5, '#C0C0C0');
            gradiente.addColorStop(1, 'rgba(192, 192, 192, 0)');

            ctx.fillStyle = gradiente;
            ctx.beginPath();
            ctx.arc(0, 0, tamanho, 0, Math.PI * 2);
            ctx.fill();

            // Brilho vertical e horizontal em cruz
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.moveTo(0, -tamanho * 2.5);
            ctx.lineTo(tamanho * 0.2, 0);
            ctx.lineTo(0, tamanho * 2.5);
            ctx.lineTo(-tamanho * 0.2, 0);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-tamanho * 2.5, 0);
            ctx.lineTo(0, tamanho * 0.2);
            ctx.lineTo(tamanho * 2.5, 0);
            ctx.lineTo(0, -tamanho * 0.2);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function animarEstrelas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            estrelas.forEach(e => {
                // Movimento contínuo
                e.x += e.velocidadeX;
                e.y += e.velocidadeY;

                if (e.x < 0) e.x = canvas.width;
                if (e.x > canvas.width) e.x = 0;
                if (e.y < 0) e.y = canvas.height;
                if (e.y > canvas.height) e.y = 0;

                // Efeito de piscar (variação de brilho)
                e.brilho += e.velocidadeBrilho;
                if (e.brilho > 1 || e.brilho < 0.1) {
                    e.velocidadeBrilho = -e.velocidadeBrilho;
                }

                desenharEstrelaPrata(e.x, e.y, e.tamanho, Math.abs(e.brilho));
            });

            requestAnimationFrame(animarEstrelas);
        }

        animarEstrelas();

        // Função simples para teste da busca
        function buscarMusica() {
            const termo = document.getElementById('campo-busca').value.toLowerCase();
            const cards = document.querySelectorAll('.card-video');
            cards.forEach(card => {
                const iframe = card.querySelector('iframe');
                const titulo = iframe.getAttribute('title').toLowerCase();
                if (termo && titulo.includes(termo)) {
                    card.classList.add('destaque-busca');
                } else {
                    card.classList.remove('destaque-busca');
                }
            });
        }
    </script>
</body>

</html>
