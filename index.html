<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lily - Músicas</title>
</head>

<body>

    <canvas id="canvas-estrelas"></canvas>

    <div class="particulas">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <div class="nota-musical">🎵</div>
        <div class="nota-musical">🎶</div>
        <div class="nota-musical">✨</div>
        <div class="nota-musical">🎵</div>
        <div class="nota-musical">🎶</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas-estrelas');
        const ctx = canvas.getContext('2d');

        function redimensionarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionarCanvas);
        redimensionarCanvas();

        const totalEstrelas = 50;
        const estrelas = [];

        // Inicializa as 50 estrelas com tamanhos e posições aleatórias
        for (let i = 0; i < totalEstrelas; i++) {
            estrelas.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                tamanho: Math.random() * 3 + 1, // Variação de tamanho
                brilho: Math.random(),
                velocidadeBrilho: Math.random() * 0.02 + 0.005,
                velocidadeX: (Math.random() - 0.5) * 0.4, // Movimento suave horizontal
                velocidadeY: (Math.random() - 0.5) * 0.4  // Movimento suave vertical
            });
        }

        // Desenha uma estrela em formato de brilho radiante (4 pontas)
        function desenharEstrelaPrata(x, y, tamanho, opacidade) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = opacidade;

            // Gradiente prateado com centro branco radiante
            const gradiente = ctx.createRadialGradient(0, 0, 0, 0, 0, tamanho * 2);
            gradiente.addColorStop(0, '#FFFFFF');
            gradiente.addColorStop(0.4, '#C0C0C0');
            gradiente.addColorStop(1, 'rgba(192, 192, 192, 0)');

            ctx.fillStyle = gradiente;

            // Desenho do brilho em cruz
            ctx.beginPath();
            ctx.arc(0, 0, tamanho, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.moveTo(0, -tamanho * 2.5);
            ctx.lineTo(tamanho * 0.3, 0);
            ctx.lineTo(0, tamanho * 2.5);
            ctx.lineTo(-tamanho * 0.3, 0);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-tamanho * 2.5, 0);
            ctx.lineTo(0, tamanho * 0.3);
            ctx.lineTo(tamanho * 2.5, 0);
            ctx.lineTo(0, -tamanho * 0.3);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function animarEstrelas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            estrelas.forEach(e => {
                // Atualiza posição (movimento contínuo)
                e.x += e.velocidadeX;
                e.y += e.velocidadeY;

                // Reposiciona se sair da tela
                if (e.x < 0) e.x = canvas.width;
                if (e.x > canvas.width) e.x = 0;
                if (e.y < 0) e.y = canvas.height;
                if (e.y > canvas.height) e.y = 0;

                // Atualiza o efeito de piscar (brilho)
                e.brilho += e.velocidadeBrilho;
                if (e.brilho > 1 || e.brilho < 0.1) {
                    e.velocidadeBrilho = -e.velocidadeBrilho;
                }

                desenharEstrelaPrata(e.x, e.y, e.tamanho, Math.abs(e.brilho));
            });

            requestAnimationFrame(animarEstrelas);
        }

        animarEstrelas();
    </script>

</body>

</html>
