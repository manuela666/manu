    <script>
        function limparTexto(texto) {
            if (!texto) return "";
            return texto
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9\s]/g, "")
                .trim();
        }

        function buscarMusica() {
            const campo = document.getElementById('campo-busca');
            const termoLimpo = limparTexto(campo.value);

            if (!termoLimpo) return;

            const cards = document.querySelectorAll('.card-video');
            let encontrado = false;

            // Limpa destaques anteriores
            cards.forEach(card => card.classList.remove('destaque-busca'));

            const palavrasBusca = termoLimpo.split(/\s+/);

            for (let card of cards) {
                const dataNome = limparTexto(card.getAttribute('data-nome'));
                const iframeTitle = limparTexto(card.querySelector('iframe')?.title);
                const textoCompleto = `${dataNome} ${iframeTitle}`;

                const corresponde = palavrasBusca.every(palavra => textoCompleto.includes(palavra));

                if (corresponde) {
                    encontrado = true;

                    // 1. Rola a página verticalmente
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // 2. Aguarda a rolagem vertical finalizar para rolar horizontalmente até o card
                    setTimeout(() => {
                        const container = card.parentElement;
                        const deslocamentoEsquerda = card.offsetLeft - (container.clientWidth / 2) + (card.clientWidth / 2);

                        container.scrollTo({
                            left: deslocamentoEsquerda,
                            behavior: 'smooth'
                        });

                        // 3. Aplica o brilho de destaque
                        card.classList.add('destaque-busca');
                    }, 300);

                    break;
                }
            }

            if (!encontrado) {
                alert('Música não encontrada! Tente usar apenas o nome da música ou do cantor.');
            }
        }

        function verificarEnter(event) {
            if (event.key === 'Enter') {
                buscarMusica();
            }
        }
    </script>
